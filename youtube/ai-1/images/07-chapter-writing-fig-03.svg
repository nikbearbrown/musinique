  <title id="fig-title-03">Three Responses to a verify Flag</title>
  <desc>A verify flag has three valid responses: verify and replace with a citation, verify and remove the sentence, or convert to a tracked note. Deleting the flag while keeping the sentence is forbidden.</desc>
