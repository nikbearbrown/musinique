  <text x="92" y="222" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">flag found</text>

  <!-- Branch 1: replace -->
  <line x1="152" y1="200" x2="370" y2="116" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="374" y="92" width="246" height="48" rx="0" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="386" y="112" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Verify and replace</text>
  <text x="386" y="128" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">with a real citation</text>

  <!-- Branch 2: remove -->
  <line x1="152" y1="206" x2="370" y2="170" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="374" y="148" width="246" height="48" rx="0" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="386" y="168" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Verify and remove</text>
  <text x="386" y="184" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">the sentence entirely</text>

  <!-- Branch 3: convert to note -->
  <line x1="152" y1="220" x2="370" y2="228" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="374" y="204" width="246" height="48" rx="0" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="386" y="224" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">Convert to a tracked note</text>
  <text x="386" y="240" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">to resolve later</text>

