  <text x="162" y="121" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="13" fill="#2a1a0e">[INFOGRAPHIC:</text>
  <!-- Segment 3: brief -->
  <rect x="222" y="96" width="446" height="40" rx="0" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="234" y="121" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="13" fill="#2a1a0e">three-node priority decision tree… ] --&gt;</text>

  <!-- Callout lines -->
  <line x1="67" y1="136" x2="67" y2="196" stroke="#C8860E" stroke-width="1"/>
  <line x1="162" y1="136" x2="162" y2="196" stroke="#787878" stroke-width="1"/>
  <line x1="380" y1="136" x2="380" y2="196" stroke="#2a1a0e" stroke-width="1"/>

  <!-- Role cell 1 -->
  <rect x="32" y="200" width="170" height="84" rx="0" fill="#FFFFFF" stroke="#C8860E" stroke-width="1"/>
  <text x="46" y="222" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">The arrow</text>
  <text x="46" y="244" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">A grep target —</text>
  <text x="46" y="258" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">marks every spot the</text>
  <text x="46" y="272" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">enrichment pass finds.</text>

