  <rect x="214" y="200" width="220" height="84" rx="0" fill="#FFFFFF" stroke="#787878" stroke-width="1"/>
  <text x="228" y="222" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">The bracket type</text>
  <text x="228" y="244" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Selects which generator</text>
  <text x="228" y="258" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">to invoke (TABLE,</text>
  <text x="228" y="272" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">INFOGRAPHIC, IMAGE…).</text>

