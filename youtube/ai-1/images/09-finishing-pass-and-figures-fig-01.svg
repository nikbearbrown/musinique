  <rect x="446" y="200" width="222" height="84" rx="0" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="460" y="222" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">The brief (after colon)</text>
  <text x="460" y="244" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">The figure brief — what</text>
  <text x="460" y="258" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">the generator should</text>
  <text x="460" y="272" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">actually draw.</text>

  <text x="32" y="324" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">One comment, three jobs: it can be found, it routes to the right tool, and it carries the instructions.</text>
