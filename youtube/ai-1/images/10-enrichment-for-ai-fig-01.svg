  <rect x="40" y="96" width="150" height="72" rx="0" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="115" y="120" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Q1</text>
  <text x="115" y="138" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Could it appear in</text>
  <text x="115" y="154" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">another field?</text>

  <!-- Gate 2 -->
  <rect x="270" y="96" width="150" height="72" rx="0" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="345" y="120" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Q2</text>
  <text x="345" y="138" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Reader brings</text>
  <text x="345" y="154" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">something only they have?</text>

