  <text x="32" y="412" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Group D — Structure &amp; Handoff (items 12–14)</text>
  <text x="56" y="434" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">12 — Sections follow the planned arc</text>
  <text x="56" y="450" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">13 — Close names next chapter's deliverable</text>
  <text x="56" y="466" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">14 — No padded middle</text>
