  <!-- Group A -->
  <text x="32" y="98" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Group A — Voice &amp; Register (items 1–4)</text>
  <line x1="56" y1="112" x2="56" y2="180" stroke="#56B4E9" stroke-width="0"/>
  <text x="56" y="120" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">1 — Sounds like the author, not the default</text>
  <text x="56" y="136" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">2 — Cold open lands; no throat-clearing</text>
  <text x="56" y="152" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">3 — Sentence rhythm varies</text>
  <text x="56" y="168" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">4 — Reads aloud without stumble</text>
  <rect x="600" y="108" width="14" height="62" fill="#FFFFFF" stroke="#C8860E" stroke-width="1"/>

  <line x1="32" y1="184" x2="668" y2="184" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Group B -->
  <text x="32" y="208" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Group B — Evidence &amp; Specificity (items 5–8)</text>
  <text x="56" y="230" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">5 — Every number has a source</text>
  <text x="56" y="246" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">6 — No fabricated names or dates</text>
  <text x="56" y="262" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">7 — Examples are concrete, not generic</text>
  <text x="56" y="278" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">8 — No unresolved [verify] flags remain</text>
  <rect x="600" y="218" width="14" height="62" fill="#FFFFFF" stroke="#C8860E" stroke-width="1"/>

  <line x1="32" y1="294" x2="668" y2="294" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Group C -->
  <text x="32" y="318" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">Group C — Judgment &amp; Argument (items 9–11)</text>
  <text x="56" y="340" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">9 — At least one real judgment per page</text>
  <text x="56" y="356" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">10 — Argument survives a 25% cut</text>
  <text x="56" y="372" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">11 — Takes a position, not a survey</text>
  <rect x="600" y="328" width="14" height="46" fill="#FFFFFF" stroke="#C8860E" stroke-width="1"/>

  <line x1="32" y1="388" x2="668" y2="388" stroke="#D4D4D4" stroke-width="1"/>

