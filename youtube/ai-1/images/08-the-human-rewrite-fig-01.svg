  <text x="32" y="506" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Fourteen items, four uneven groups (4 / 4 / 3 / 3). A chapter passes only when every box is marked.</text>
