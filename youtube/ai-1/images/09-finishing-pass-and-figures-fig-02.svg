<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-02">
  <title id="fig-title-02">CAJAL Figure-Priority Decision Path</title>
  <desc>A three-node decision tree applied during the editorial pass: Critical if it maps to a primary outcome, Important if it supports a key argument, Supplementary otherwise — which is skipped unless time allows.</desc>
  <metadata>
    <cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0"
      book="AI+1" book-slug="ai-1" chapter="09-finishing-pass-and-figures"
      figure-number="02" figure-title="CAJAL Figure-Priority Decision Path" figure-slug="figure-priority-decision-path"
      figure-type="process flowchart" priority="Important"
      author="Nik Bear Brown" date-generated="2026-05-28"
      source-file="pantry/09-finishing-pass-and-figures-cajal.md"/>
  </metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>

  <text x="32" y="40" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" font-weight="400" fill="#2a1a0e">CAJAL Figure-Priority Decision Path</text>

  <!-- Node 1: Critical -->
  <rect x="190" y="74" width="320" height="58" rx="0" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="350" y="98" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">CRITICAL</text>
  <text x="350" y="118" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Maps to a primary outcome?</text>

  <!-- Keep outcome from Critical (yes) -->
  <line x1="510" y1="103" x2="588" y2="103" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="548" y="96" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">yes</text>
  <rect x="592" y="84" width="76" height="38" rx="0" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="630" y="107" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e" font-weight="600">KEEP</text>

  <!-- Demote arrow Critical -> Important (no) -->
  <line x1="350" y1="132" x2="350" y2="178" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="362" y="158" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">no — demote</text>

  <!-- Node 2: Important -->
  <rect x="190" y="180" width="320" height="58" rx="0" fill="#FFFFFF" stroke="#C8860E" stroke-width="1.5"/>
  <text x="350" y="204" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">IMPORTANT</text>
  <text x="350" y="224" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Supports a key argument?</text>

  <!-- Keep outcome from Important (yes) -->
  <line x1="510" y1="209" x2="588" y2="209" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="548" y="202" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">yes</text>
  <rect x="592" y="190" width="76" height="38" rx="0" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="630" y="213" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e" font-weight="600">KEEP</text>

  <!-- Demote arrow Important -> Supplementary (no) -->
  <line x1="350" y1="238" x2="350" y2="284" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="362" y="264" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">no — demote</text>

  <!-- Node 3: Supplementary -->
  <rect x="190" y="286" width="320" height="58" rx="0" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="350" y="310" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" font-weight="600">SUPPLEMENTARY</text>
  <text x="350" y="330" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Skip unless time allows</text>

  <!-- Skip outcome with blockage glyph -->
  <line x1="510" y1="315" x2="582" y2="315" stroke="#C8102E" stroke-width="1.5" fill="none"/>
  <line x1="582" y1="299" x2="582" y2="331" stroke="#C8102E" stroke-width="2.5"/>
  <text x="630" y="312" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#C8102E" font-weight="600">SKIP</text>
  <text x="630" y="328" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#C8102E">(no time)</text>

  <text x="32" y="392" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Each figure falls through the tests. Pass a test, keep it; fail, demote one level. Supplementary figures are</text>
  <text x="32" y="408" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">the first cut when the ten-minute editorial pass runs short.</text>
</svg>
