<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The four synthesis markers</title>
<style>
  :root {
    --color-white:#FFFFFF; --color-ink:#2a1a0e; --color-red:#C8102E;
    --color-secondary:#545454; --color-border:#D4D4D4; --color-ochre:#C8860E; --color-fill:#F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --color-white:#111111; --color-ink:#F0EBE3; --color-red:#E8243A;
      --color-secondary:#A0978C; --color-border:#2E2E2E; --color-ochre:#D49A30; --color-fill:#1A1A1A; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-sub { font-size: 13px; fill: var(--color-secondary); }
  .marker-label { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; font-size: 10px; fill: var(--color-ink); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
function draw() {
  d3.select('#chart').selectAll('*').remove();
  const c = document.getElementById('chart');
  const totalWidth = c.clientWidth || 800;
  const totalHeight = Math.max(420, Math.min(500, totalWidth * 0.6));
  const margin = { top: 64, right: 40, bottom: 32, left: 40 };
  const w = totalWidth - margin.left - margin.right;
  const h = totalHeight - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
  svg.append('title').attr('id','chart-title').text('The four synthesis markers');
  svg.append('desc').attr('id','chart-desc').text('Three overlapping circles encode the synthesis markers: triple-overlap is all-three-agree, a pairwise lens is two-agree, a single crescent is one-only, and a separate fork marks divergent.');

  svg.append('text').attr('class','chart-title').attr('x',margin.left).attr('y',26).text('Four synthesis markers');
  svg.append('text').attr('class','chart-sub').attr('x',margin.left).attr('y',46).text('Overlap geometry, source-agnostic');

  const g = svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);
  const cx = w*0.52, cy = h*0.46, r = Math.min(w,h)*0.24, off = r*0.6;
  const colors = ['var(--color-ochre)','var(--color-secondary)','var(--color-ink)'];
  const centers = [
    { x: cx,          y: cy-off },
    { x: cx-off*0.95, y: cy+off*0.55 },
    { x: cx+off*0.95, y: cy+off*0.55 }
  ];
  centers.forEach((s,i)=>{
    g.append('circle').attr('cx',s.x).attr('cy',s.y).attr('r',r)
      .attr('fill',colors[i]).attr('fill-opacity',0.10).attr('stroke',colors[i]).attr('stroke-width',2)
      .attr('aria-hidden','true');
  });

  function callout(x,y,tx,ty,label){
    g.append('line').attr('x1',x).attr('y1',y).attr('x2',tx).attr('y2',ty).attr('stroke','var(--color-ink)').attr('stroke-width',1).attr('aria-hidden','true');
    g.append('circle').attr('cx',x).attr('cy',y).attr('r',2.5).attr('fill','var(--color-ink)').attr('aria-hidden','true');
    g.append('text').attr('class','marker-label').attr('x',tx).attr('y',ty<cy?ty-4:ty+12).attr('text-anchor', tx<cx?'end':'start').text(label);
  }
  // all three (center)
  callout(cx, cy, cx, h-8, 'ALL THREE AGREE');
  // two agree (top pairwise lens between circles 1 and 2 region)
  callout((centers[0].x+centers[1].x)/2 - off*0.2, (centers[0].y+centers[1].y)/2, w*0.06, cy-off, 'TWO AGREE');
  // one only (crescent of circle 3)
  callout(centers[2].x + r*0.55, centers[2].y, w*0.98, centers[2].y, 'ONE ONLY');
  // divergent fork marker (separate)
  const fx = w*0.10, fy = h*0.82;
  g.append('path').attr('d',`M ${fx} ${fy} l 16 -11 M ${fx} ${fy} l 16 11`).attr('stroke','var(--color-red)').attr('stroke-width',2).attr('fill','none').attr('aria-hidden','true');
  g.append('text').attr('class','marker-label').attr('fill','var(--color-red)').attr('x',fx).attr('y',fy+24).text('DIVERGENT — all stated');
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
