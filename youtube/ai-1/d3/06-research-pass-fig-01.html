<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 6.1 — The Gatherer pipeline and where the human re-enters</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
    --color-fill:      #F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
      --color-fill:      #1A1A1A;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
         font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-size: 13px; fill: var(--color-secondary); }
  .node-label { font-size: 11px; fill: var(--color-white); }
  .band-label { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; font-size: 11px; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0;
             background: var(--color-white); color: var(--color-ink);
             border: 1px solid var(--color-border); border-radius: 8px;
             padding: 8px 10px; font-size: 13px; max-width: 240px;
             box-shadow: 0 6px 20px -6px rgb(18 18 18 / 0.14); }
  .node-rect { transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const stages = [
  { id: 1, label: 'Problem formulation', band: 'machine', desc: 'Reads the capability statement, outcomes, bridge question, domain.' },
  { id: 2, label: 'Data collection', band: 'machine', desc: 'Consults _lib_ files, then runs web research.' },
  { id: 3, label: 'Presentation', band: 'machine', desc: 'Writes the nine-section notes file — the draft pantry.' },
  { id: 4, label: 'Evaluation', band: 'human', desc: 'The four-questions pass. Yours. Cooper stage the Gatherer cannot compress.' },
  { id: 5, label: 'Analysis', band: 'human', desc: 'Judging fit and supplementing. Yours.' },
  { id: 6, label: 'Draft-ready', band: 'terminal', desc: 'A pantry file Cowork can draft from without inventing.' }
];
const bandColor = { machine: 'var(--color-ink)', human: 'var(--color-ochre)', terminal: 'var(--color-red)' };

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const margin = { top: 72, right: 24, bottom: 48, left: 24 };
  const container = document.getElementById('chart');
  const totalWidth = container.clientWidth || 800;
  const totalHeight = 280;
  const chartWidth = totalWidth - margin.left - margin.right;
  const chartHeight = totalHeight - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text('The Gatherer pipeline and where the human re-enters');
  svg.append('desc').attr('id', 'chart-desc').text('Three machine stages, a hand-off seam, two human stages, and a draft-ready terminal along Cooper\'s review chain.');

  svg.append('text').attr('class', 'chart-title').attr('x', margin.left).attr('y', 24).text('Gatherer pipeline and the hand-off seam');
  svg.append('text').attr('class', 'chart-subtitle').attr('x', margin.left).attr('y', 44).text('Gatherer = Cooper stages 1–3; evaluation and analysis are yours');

  const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  const n = stages.length;
  const slot = chartWidth / n;
  const boxW = Math.min(slot * 0.82, 130), boxH = 64;
  const cy = chartHeight / 2;
  stages.forEach((d, i) => { d.cx = slot * i + slot / 2; });

  const defs = svg.append('defs');
  defs.append('marker').attr('id', 'arrow61').attr('viewBox', '0 0 10 10')
    .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto-start-reverse')
    .append('path').attr('d', 'M0,0 L10,5 L0,10 Z').attr('fill', 'var(--color-ink)');

  const gAxes = gChart.append('g').attr('aria-hidden', 'true');
  for (let i = 0; i < n - 1; i++) {
    gAxes.append('line').attr('x1', stages[i].cx + boxW / 2).attr('y1', cy)
      .attr('x2', stages[i + 1].cx - boxW / 2 - 4).attr('y2', cy)
      .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1).attr('marker-end', 'url(#arrow61)');
  }

  // the seam between stage 3 and stage 4
  const seamX = (stages[2].cx + stages[3].cx) / 2;
  gAxes.append('line').attr('x1', seamX).attr('x2', seamX).attr('y1', -8).attr('y2', chartHeight + 8)
    .attr('stroke', 'var(--color-ink)').attr('stroke-width', 2).attr('stroke-dasharray', '2 3');
  gChart.append('text').attr('class', 'band-label').attr('x', seamX).attr('y', -16).attr('text-anchor', 'middle').text('the seam');
  gChart.append('text').attr('class', 'band-label').attr('x', stages[1].cx).attr('y', chartHeight + 28).attr('text-anchor', 'middle').text('machine / Gatherer');
  gChart.append('text').attr('class', 'band-label').attr('x', stages[4].cx).attr('y', chartHeight + 28).attr('text-anchor', 'middle').text('human / four questions');

  const g = gChart.selectAll('.node-g').data(stages).join('g').attr('class', 'node-g')
    .attr('tabindex', 0).attr('role', 'img').attr('aria-label', d => `${d.label}: ${d.desc}`);
  g.append('rect').attr('class', 'node-rect').attr('x', d => d.cx - boxW / 2).attr('y', cy - boxH / 2)
    .attr('width', boxW).attr('height', boxH).attr('rx', 8)
    .attr('fill', d => bandColor[d.band]).attr('stroke', 'var(--color-ink)').attr('stroke-width', 1);
  g.append('text').attr('class', 'node-label').attr('x', d => d.cx).attr('y', cy + 4)
    .attr('text-anchor', 'middle').each(function(d) {
      const words = d.label.split(' ');
      const t = d3.select(this);
      if (words.length > 1) {
        t.append('tspan').attr('x', d.cx).attr('dy', '-0.3em').text(words[0]);
        t.append('tspan').attr('x', d.cx).attr('dy', '1.1em').text(words.slice(1).join(' '));
      } else { t.text(d.label); }
    });

  function show(event, d) { tooltip.html(`<strong>${d.label}</strong><br>${d.desc}`)
    .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
    .transition().duration(150).style('opacity', 1); }
  function move(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
  function hide() { tooltip.transition().duration(100).style('opacity', 0); }

  g.on('mouseover', function(event, d) { g.selectAll('.node-rect').attr('opacity', 0.35); d3.select(this).select('.node-rect').attr('opacity', 1); show(event, d); })
    .on('mousemove', move)
    .on('mouseout', function() { g.selectAll('.node-rect').attr('opacity', 1); hide(); })
    .on('focus', function(event, d) { show(event, d); }).on('blur', hide);
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
