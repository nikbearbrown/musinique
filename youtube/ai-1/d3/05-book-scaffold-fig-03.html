<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 5.3 — Chapter filename order = EPUB build order</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
    --color-fill:      #F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
      --color-fill:      #1A1A1A;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
         font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-size: 13px; fill: var(--color-secondary); }
  .tile-label { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; font-size: 11px; fill: var(--color-white); }
  .out-label { font-size: 12px; fill: var(--color-white); font-weight: 600; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0;
             background: var(--color-white); color: var(--color-ink);
             border: 1px solid var(--color-border); border-radius: 8px;
             padding: 8px 10px; font-size: 13px; max-width: 240px;
             box-shadow: 0 6px 20px -6px rgb(18 18 18 / 0.14); }
  .tile, .seg { transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const tiles = [
  { id: 0, label: '00-frontmatter', ellipsis: false, desc: 'Front matter — first in concatenation order.' },
  { id: 1, label: '01-...', ellipsis: false, desc: 'Chapter 1 — second in build order.' },
  { id: 2, label: '02-...', ellipsis: false, desc: 'Chapter 2 — third in build order.' },
  { id: 3, label: '...', ellipsis: true,  desc: 'The remaining numbered chapter files, in ascending prefix order.' },
  { id: 4, label: '99-back-matter', ellipsis: false, desc: 'Back matter — last in concatenation order.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const margin = { top: 64, right: 40, bottom: 32, left: 40 };
  const container = document.getElementById('chart');
  const totalWidth = container.clientWidth || 800;
  const tileH = 38, gap = 10;
  const totalHeight = margin.top + tiles.length * (tileH + gap) + margin.bottom;
  const chartWidth = totalWidth - margin.left - margin.right;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text('Chapter filename order equals EPUB build order');
  svg.append('desc').attr('id', 'chart-desc').text('Numbered chapter files concatenate in ascending filename order into a single output document whose internal divisions preserve that order.');

  svg.append('text').attr('class', 'chart-title').attr('x', margin.left).attr('y', 24).text('Filename order = build order');
  svg.append('text').attr('class', 'chart-subtitle').attr('x', margin.left).attr('y', 44).text('cat chapters/*.md glues files in ascending prefix order');

  const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  const tileW = Math.min(chartWidth * 0.38, 220);
  const outX = chartWidth - tileW - 6;
  const outTop = 0, outH = tiles.length * (tileH + gap) - gap;

  tiles.forEach((d, i) => { d.x = 0; d.y = i * (tileH + gap); });

  const defs = svg.append('defs');
  defs.append('marker').attr('id', 'arrow53').attr('viewBox', '0 0 10 10')
    .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto-start-reverse')
    .append('path').attr('d', 'M0,0 L10,5 L0,10 Z').attr('fill', 'var(--color-ink)');

  // arrow from stack to output
  gChart.append('line').attr('aria-hidden', 'true')
    .attr('x1', tileW + 6).attr('y1', outH / 2).attr('x2', outX - 6).attr('y2', outH / 2)
    .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1).attr('marker-end', 'url(#arrow53)');

  // source tiles
  const gTiles = gChart.selectAll('.tile-g').data(tiles).join('g').attr('class', 'tile-g')
    .attr('tabindex', 0).attr('role', 'img').attr('aria-label', d => `${d.label}: ${d.desc}`);
  gTiles.append('rect').attr('class', 'tile').attr('x', d => d.x).attr('y', d => d.y)
    .attr('width', tileW).attr('height', tileH).attr('rx', 4)
    .attr('fill', d => d.ellipsis ? 'var(--color-secondary)' : 'var(--color-ink)')
    .attr('fill-opacity', d => d.ellipsis ? 0.5 : 1)
    .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1);
  gTiles.append('text').attr('class', 'tile-label').attr('x', d => d.x + tileW / 2).attr('y', d => d.y + tileH / 2 + 4)
    .attr('text-anchor', 'middle').text(d => d.label);

  // output concatenated stack with mirrored divisions
  const gOut = gChart.append('g');
  gOut.append('rect').attr('x', outX).attr('y', outTop).attr('width', tileW).attr('height', outH)
    .attr('rx', 6).attr('fill', 'var(--color-red)').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1).attr('aria-hidden', 'true');
  const segH = outH / tiles.length;
  const gSeg = gOut.selectAll('.seg-g').data(tiles).join('g').attr('class', 'seg-g')
    .attr('tabindex', 0).attr('role', 'img').attr('aria-label', d => `Output segment for ${d.label}, preserving its build position.`);
  gSeg.append('rect').attr('class', 'seg').attr('x', outX).attr('y', (d, i) => outTop + i * segH)
    .attr('width', tileW).attr('height', segH).attr('fill', 'var(--color-red)')
    .attr('stroke', 'var(--color-white)').attr('stroke-width', 1).attr('stroke-opacity', 0.5);
  gOut.append('text').attr('class', 'out-label').attr('x', outX + tileW / 2).attr('y', -8)
    .attr('text-anchor', 'middle').attr('fill', 'var(--color-secondary)').text('combined.md → EPUB');

  function show(event, d) { tooltip.html(`<strong>${d.label}</strong><br>${d.desc}`)
    .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
    .transition().duration(150).style('opacity', 1); }
  function move(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
  function hide() { tooltip.transition().duration(100).style('opacity', 0); }

  function linkHover(thisId) {
    gTiles.selectAll('.tile').attr('opacity', t => t.id === thisId ? 1 : 0.35);
    gSeg.selectAll('.seg').attr('opacity', t => t.id === thisId ? 1 : 0.35);
  }
  function clear() { gTiles.selectAll('.tile').attr('opacity', 1); gSeg.selectAll('.seg').attr('opacity', 1); }

  d3.selectAll('.tile-g, .seg-g')
    .on('mouseover', function(event, d) { linkHover(d.id); show(event, d); })
    .on('mousemove', move)
    .on('mouseout', function() { clear(); hide(); })
    .on('focus', function(event, d) { linkHover(d.id); show(event, d); })
    .on('blur', function() { clear(); hide(); });
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
