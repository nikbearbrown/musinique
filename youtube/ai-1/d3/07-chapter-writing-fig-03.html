<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The three responses to a verify flag</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
    --color-fill:      #F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
      --color-fill:      #1B1B1B;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-size: 13px; fill: var(--color-secondary); }
  .source-rect { fill: var(--color-fill); stroke: var(--color-ink); stroke-width: 1; }
  .leaf-rect { fill: var(--color-fill); stroke: var(--color-ink); stroke-width: 1;
    transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .leaf-rect.forbidden { stroke: var(--color-red); }
  .node-label { font-size: 12px; fill: var(--color-ink); }
  .branch-valid { stroke: var(--color-ink); stroke-width: 1.5; fill: none; }
  .branch-forbidden { stroke: var(--color-red); stroke-width: 1.5; fill: none; }
  .block-glyph { stroke: var(--color-red); stroke-width: 2; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0;
    background: var(--color-white); color: var(--color-ink);
    border: 1px solid var(--color-border); padding: 6px 10px; font-size: 13px;
    font-family: 'Inter', sans-serif; max-width: 240px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const branchData = [
  { label: 'Verify and replace with citation', valid: true, detail: 'The claim is true; find the source; replace the flag with the citation.' },
  { label: 'Verify and remove the sentence', valid: true, detail: 'The claim is wrong or unfindable; cut the sentence.' },
  { label: 'Convert to a tracked note', valid: true, detail: 'Leave for later: move the inline flag to your tracking file.' },
  { label: 'Delete the flag, keep the sentence', valid: false, detail: 'Forbidden: this launders the model uncertainty into your authorial voice.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const totalWidth = document.getElementById('chart').clientWidth || 800;
  const margin = { top: 64, right: 24, bottom: 24, left: 24 };
  const chartWidth = totalWidth - margin.left - margin.right;
  const leafH = 52, leafGap = 18;
  const totalHeight = margin.top + branchData.length * (leafH + leafGap) + margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text('The three responses to a verify flag');
  svg.append('desc').attr('id', 'chart-desc')
    .text('A branch decision from a single source node — a verify flag found — to three valid output branches (replace with citation, remove the sentence, convert to a tracked note) and one forbidden branch (delete the flag, keep the sentence) terminated with a blockage glyph.');

  const defs = svg.append('defs');
  defs.append('marker').attr('id', 'arrowInk').attr('viewBox', '0 0 10 10')
    .attr('refX', 8).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7)
    .attr('orient', 'auto-start-reverse').append('path')
    .attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', 'var(--color-ink)');

  svg.append('text').attr('class', 'chart-title').attr('x', margin.left).attr('y', 24)
    .text('Three responses to a verify flag');
  svg.append('text').attr('class', 'chart-subtitle').attr('x', margin.left).attr('y', 44)
    .text('Three valid branches, one forbidden');

  const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const srcW = Math.min(140, chartWidth * 0.32), srcH = 56;
  const srcX = 0, srcY = (totalHeight - margin.top - margin.bottom) / 2 - srcH / 2;
  const leafX = srcX + srcW + Math.min(70, chartWidth * 0.14);
  const leafW = chartWidth - leafX;

  const gLinks = gChart.append('g').attr('aria-hidden', 'true');
  branchData.forEach((d, i) => {
    const ly = i * (leafH + leafGap) + leafH / 2;
    const sx = srcX + srcW, sy = srcY + srcH / 2;
    const path = `M${sx},${sy} C${sx + 30},${sy} ${leafX - 30},${ly} ${leafX},${ly}`;
    if (d.valid) {
      gLinks.append('path').attr('class', 'branch-valid').attr('marker-end', 'url(#arrowInk)').attr('d', path);
    } else {
      gLinks.append('path').attr('class', 'branch-forbidden').attr('d', path);
      // blockage glyph just before the leaf
      gLinks.append('line').attr('class', 'block-glyph')
        .attr('x1', leafX - 10).attr('y1', ly - 9).attr('x2', leafX - 10).attr('y2', ly + 9);
    }
  });

  // source node
  const gSource = gChart.append('g').attr('tabindex', 0)
    .attr('aria-label', 'Source: a verify flag is found in the draft.');
  gSource.append('rect').attr('class', 'source-rect')
    .attr('x', srcX).attr('y', srcY).attr('width', srcW).attr('height', srcH);
  gSource.append('text').attr('class', 'node-label')
    .attr('x', srcX + srcW / 2).attr('y', srcY + srcH / 2).attr('text-anchor', 'middle').attr('dy', '0.35em')
    .text('Verify flag found');

  const leaves = gChart.selectAll('.leaf').data(branchData).join('g')
    .attr('class', 'leaf').attr('transform', (d, i) => `translate(${leafX},${i * (leafH + leafGap)})`)
    .attr('tabindex', 0).attr('aria-label', d => `${d.valid ? 'Valid' : 'Forbidden'} branch: ${d.label}. ${d.detail}`);

  leaves.append('rect').attr('class', d => 'leaf-rect' + (d.valid ? '' : ' forbidden'))
    .attr('width', leafW).attr('height', leafH);
  leaves.append('text').attr('class', 'node-label')
    .attr('x', 10).attr('y', leafH / 2).attr('dy', '0.35em')
    .each(function(d) {
      const words = d.label.split(' '); const t = d3.select(this);
      if (leafW < 200 && words.length > 3) {
        t.text(null);
        const mid = Math.ceil(words.length / 2);
        t.append('tspan').attr('x', 10).attr('dy', '-0.2em').text(words.slice(0, mid).join(' '));
        t.append('tspan').attr('x', 10).attr('dy', '1.1em').text(words.slice(mid).join(' '));
      } else { t.text(d.label); }
    });

  leaves.on('mouseover', (event, d) => {
    leaves.selectAll('.leaf-rect').attr('opacity', 0.35);
    d3.select(event.currentTarget).select('.leaf-rect').attr('opacity', 1);
    tooltip.html(`<strong>${d.valid ? 'Valid' : 'Forbidden'}</strong><br>${d.detail}`)
      .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
      .transition().duration(150).style('opacity', 1);
  })
  .on('mousemove', (event) => tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'))
  .on('mouseout', () => {
    leaves.selectAll('.leaf-rect').attr('opacity', 1);
    tooltip.transition().duration(100).style('opacity', 0);
  });
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
