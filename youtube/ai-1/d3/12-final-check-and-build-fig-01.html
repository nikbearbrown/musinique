<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The four-step ship sequence</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
    --color-fill:      #F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
      --color-fill:      #1B1B1B;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
         font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-size: 13px; fill: var(--color-secondary); }
  .step-rect { fill: var(--color-fill); stroke: var(--color-ink); stroke-width: 1; }
  .step-label { font-size: 12px; fill: var(--color-ink); }
  .flow { stroke: var(--color-ink); stroke-width: 1.5; fill: none; }
  .loop { stroke: var(--color-red); stroke-width: 1.5; fill: none; }
  .loop-label { font-size: 11px; fill: var(--color-red); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const steps = ['Fact-check', 'Build', 'Device read', 'Submit'];

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const container = document.getElementById('chart');
    const totalWidth = container.clientWidth || 820;
    const totalHeight = Math.max(280, Math.min(360, totalWidth * 0.42));
    const margin = { top: 70, right: 30, bottom: 80, left: 30 };
    const chartWidth = totalWidth - margin.left - margin.right;
    const chartHeight = totalHeight - margin.top - margin.bottom;

    const svg = d3.select('#chart').append('svg')
      .attr('width', totalWidth).attr('height', totalHeight)
      .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
    svg.append('title').attr('id', 'chart-title').text('The four-step ship sequence');
    svg.append('desc').attr('id', 'chart-desc')
      .text('Four step nodes — fact-check, build, device read, submit — run left to right, with a curved return arc from submit back to build marking the intentional rebuild loop.');

    svg.append('text').attr('x', margin.left).attr('y', 28).attr('class', 'chart-title')
      .text('The four-step ship sequence');
    svg.append('text').attr('x', margin.left).attr('y', 46).attr('class', 'chart-subtitle')
      .text('The rebuild loop is not a failure of the pipeline. It is the pipeline.');

    const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
    const n = steps.length;
    const gap = 36;
    const nodeW = (chartWidth - gap * (n - 1)) / n;
    const nodeH = 56;
    const cy = chartHeight / 2;

    const defs = svg.append('defs');
    defs.append('marker').attr('id', 'arrF').attr('viewBox', '0 0 10 10')
      .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7)
      .attr('orient', 'auto-start-reverse')
      .append('path').attr('d', 'M0,0 L10,5 L0,10 z')
      .attr('fill', getComputedStyle(document.body).getPropertyValue('--color-ink'));
    defs.append('marker').attr('id', 'arrR').attr('viewBox', '0 0 10 10')
      .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7)
      .attr('orient', 'auto-start-reverse')
      .append('path').attr('d', 'M0,0 L10,5 L0,10 z')
      .attr('fill', getComputedStyle(document.body).getPropertyValue('--color-red'));

    const xs = steps.map((_, i) => i * (nodeW + gap));

    for (let i = 0; i < n - 1; i++) {
      gChart.append('path').attr('class', 'flow').attr('marker-end', 'url(#arrF)')
        .attr('d', `M${xs[i] + nodeW},${cy} L${xs[i + 1] - 2},${cy}`);
    }

    // return arc: submit (last) back to build (index 1), below the row
    const fromX = xs[n - 1] + nodeW / 2;
    const toX = xs[1] + nodeW / 2;
    const arcY = cy + nodeH / 2 + 50;
    gChart.append('path').attr('class', 'loop').attr('marker-end', 'url(#arrR)')
      .attr('d', `M${fromX},${cy + nodeH / 2} C${fromX},${arcY} ${toX},${arcY} ${toX},${cy + nodeH / 2 + 2}`);
    gChart.append('text').attr('class', 'loop-label')
      .attr('x', (fromX + toX) / 2).attr('y', arcY + 4).attr('text-anchor', 'middle')
      .text('rebuild loop');

    steps.forEach((s, i) => {
      const g = gChart.append('g').attr('tabindex', 0).attr('role', 'img')
        .attr('aria-label', `Step ${i + 1}: ${s}`);
      g.append('rect').attr('class', 'step-rect')
        .attr('x', xs[i]).attr('y', cy - nodeH / 2).attr('width', nodeW).attr('height', nodeH).attr('rx', 4);
      g.append('text').attr('class', 'step-label')
        .attr('x', xs[i] + nodeW / 2).attr('y', cy + 4).attr('text-anchor', 'middle').text(s);
    });
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
