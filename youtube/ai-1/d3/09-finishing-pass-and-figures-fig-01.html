<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy of a visual placeholder comment</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
    --color-fill:      #F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
      --color-fill:      #1B1B1B;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-size: 13px; fill: var(--color-secondary); }
  .seg-rect { stroke: var(--color-ink); stroke-width: 1;
    transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .seg-text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; fill: var(--color-ink); text-anchor: middle; }
  .role-rect { fill: var(--color-fill); stroke: var(--color-border); stroke-width: 1; }
  .role-text { font-size: 12px; fill: var(--color-ink); text-anchor: middle; }
  .callout { stroke: var(--color-ink); stroke-width: 1; fill: none; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0;
    background: var(--color-white); color: var(--color-ink);
    border: 1px solid var(--color-border); padding: 6px 10px; font-size: 13px;
    font-family: 'Inter', sans-serif; max-width: 240px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
// three segments of the comment string, with their tint roles and downstream uses
const segData = [
  { token: '→', frac: 0.10, tint: 'var(--color-ochre)', role: 'Grep target', detail: 'Find every pending visual at once.' },
  { token: '[INFOGRAPHIC:', frac: 0.30, tint: 'var(--color-red)', role: 'Generator selector', detail: 'Tells the enrichment pass which generator to invoke.' },
  { token: 'Five Failure Modes ... no gradients.]', frac: 0.60, tint: 'var(--color-ink)', role: 'Figure brief', detail: 'The instruction the figure-generation step reads.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const totalWidth = document.getElementById('chart').clientWidth || 800;
  const margin = { top: 64, right: 24, bottom: 32, left: 24 };
  const chartWidth = totalWidth - margin.left - margin.right;
  const barY = 0, barH = 40, dropH = 56, roleH = 48;
  const totalHeight = margin.top + barH + dropH + roleH + margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text('Anatomy of a visual placeholder comment');
  svg.append('desc').attr('id', 'chart-desc')
    .text('A placeholder-comment string segmented into three regions — the arrow as grep target, the bracket type as generator selector, the brief as figure brief — each dropping a callout to a reserved cell naming its downstream role.');

  svg.append('text').attr('class', 'chart-title').attr('x', margin.left).attr('y', 24).text('Anatomy of a placeholder comment');
  svg.append('text').attr('class', 'chart-subtitle').attr('x', margin.left).attr('y', 44).text('Arrow, bracket type, brief');

  const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  let x = 0;
  const segs = segData.map(d => { const w = d.frac * chartWidth; const o = { ...d, x, w }; x += w; return o; });

  const gSeg = gChart.selectAll('.seg').data(segs).join('g')
    .attr('class', 'seg').attr('tabindex', 0)
    .attr('aria-label', d => `Segment ${d.token}. Role: ${d.role}. ${d.detail}`);

  gSeg.append('rect').attr('class', 'seg-rect')
    .attr('x', d => d.x).attr('y', barY).attr('width', d => d.w).attr('height', barH)
    .attr('fill', d => d.tint).attr('opacity', 0.16);
  gSeg.append('text').attr('class', 'seg-text')
    .attr('x', d => d.x + d.w / 2).attr('y', barY + barH / 2 + 4)
    .text(d => d.token.length > 18 && d.w < 220 ? 'brief ...' : d.token);

  // callouts and role cells
  const roleY = barH + dropH;
  segs.forEach((d, i) => {
    const cx = d.x + d.w / 2;
    gChart.append('path').attr('class', 'callout').attr('aria-hidden', 'true')
      .attr('d', `M${cx},${barH} L${cx},${roleY}`);
    gChart.append('rect').attr('class', 'role-rect')
      .attr('x', d.x + 4).attr('y', roleY).attr('width', d.w - 8).attr('height', roleH);
    gChart.append('text').attr('class', 'role-text')
      .attr('x', cx).attr('y', roleY + roleH / 2 + 4)
      .each(function() {
        const words = d.role.split(' '); const t = d3.select(this);
        if (words.length > 1 && d.w < 160) {
          t.text(null);
          t.append('tspan').attr('x', cx).attr('dy', '-0.2em').text(words[0]);
          t.append('tspan').attr('x', cx).attr('dy', '1.1em').text(words.slice(1).join(' '));
        } else { t.text(d.role); }
      });
  });

  gSeg.on('mouseover', (event, d) => {
    gSeg.selectAll('.seg-rect').attr('opacity', 0.08);
    d3.select(event.currentTarget).select('.seg-rect').attr('opacity', 0.32);
    tooltip.html(`<strong>${d.role}</strong><br>${d.detail}`)
      .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
      .transition().duration(150).style('opacity', 1);
  })
  .on('mousemove', (event) => tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'))
  .on('mouseout', () => { gSeg.selectAll('.seg-rect').attr('opacity', 0.16); tooltip.transition().duration(100).style('opacity', 0); });
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
