<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silent vs interactive mode gates</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
    --color-fill:      #F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
      --color-fill:      #1B1B1B;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
         font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-size: 13px; fill: var(--color-secondary); }
  .node-label { font-size: 11px; fill: var(--color-ink); }
  .track-label { font-size: 11px; fill: var(--color-secondary); font-weight: 700; }
  .node-rect { fill: var(--color-fill); stroke: var(--color-ink); stroke-width: 1; }
  .silent-rect { fill: var(--color-fill); stroke: var(--color-secondary); stroke-width: 1; }
  .lock-rect { fill: var(--color-fill); stroke: var(--color-red); stroke-width: 1.5; }
  .out-rect { fill: var(--color-fill); stroke: var(--color-ink); stroke-width: 1.5; }
  .flow { stroke: var(--color-ink); stroke-width: 1.5; fill: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const gates = ['Chapter', 'One-sentence concept', 'Prior knowledge', 'Components', 'Exclusions'];

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const container = document.getElementById('chart');
    const totalWidth = container.clientWidth || 820;
    const totalHeight = Math.max(300, Math.min(380, totalWidth * 0.42));
    const margin = { top: 70, right: 30, bottom: 30, left: 30 };
    const chartWidth = totalWidth - margin.left - margin.right;
    const chartHeight = totalHeight - margin.top - margin.bottom;

    const svg = d3.select('#chart').append('svg')
      .attr('width', totalWidth).attr('height', totalHeight)
      .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
    svg.append('title').attr('id', 'chart-title').text('Silent vs interactive mode gates');
    svg.append('desc').attr('id', 'chart-desc')
      .text('A top silent track runs one node straight to the shared SCOPE output; a bottom interactive track passes through five sequential gates whose final exclusions gate is a hard blocking lock before reaching the same output.');

    svg.append('text').attr('x', margin.left).attr('y', 28).attr('class', 'chart-title')
      .text('Silent vs interactive mode gates');
    svg.append('text').attr('x', margin.left).attr('y', 46).attr('class', 'chart-subtitle')
      .text('Two paths to one SCOPE; the exclusions gate is held hardest.');

    const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
    const topY = chartHeight * 0.22;
    const botY = chartHeight * 0.72;
    const nodeH = 40;
    const outX = chartWidth - 110;
    const outY = chartHeight / 2 - nodeH / 2;
    const outW = 100;

    const defs = svg.append('defs');
    defs.append('marker').attr('id', 'arr3').attr('viewBox', '0 0 10 10')
      .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7)
      .attr('orient', 'auto-start-reverse')
      .append('path').attr('d', 'M0,0 L10,5 L0,10 z')
      .attr('fill', getComputedStyle(document.body).getPropertyValue('--color-ink'));

    gChart.append('text').attr('class', 'track-label')
      .attr('x', 0).attr('y', topY - 18).text('Silent mode');
    gChart.append('text').attr('class', 'track-label')
      .attr('x', 0).attr('y', botY - 18).text('Interactive mode');

    // silent node
    const silentW = 90;
    gChart.append('rect').attr('class', 'silent-rect')
      .attr('x', 0).attr('y', topY).attr('width', silentW).attr('height', nodeH).attr('rx', 4)
      .attr('tabindex', 0).attr('role', 'img').attr('aria-label', 'Silent mode: infer SCOPE immediately');
    gChart.append('text').attr('class', 'node-label')
      .attr('x', silentW / 2).attr('y', topY + nodeH / 2 + 4).attr('text-anchor', 'middle').text('Infer SCOPE');
    gChart.append('path').attr('class', 'flow').attr('marker-end', 'url(#arr3)')
      .attr('d', `M${silentW},${topY + nodeH / 2} L${outX - 2},${outY + nodeH * 0.3}`);

    // interactive gates
    const gapX = (outX - 10) / gates.length;
    const gateW = gapX - 14;
    gates.forEach((label, i) => {
      const x = i * gapX;
      const isLock = (i === gates.length - 1);
      const g = gChart.append('g').attr('tabindex', 0).attr('role', 'img')
        .attr('aria-label', `Gate ${i + 1}: ${label}` + (isLock ? ' (held hardest — blocks until satisfied)' : ''));
      g.append('rect').attr('class', isLock ? 'lock-rect' : 'node-rect')
        .attr('x', x).attr('y', botY).attr('width', gateW).attr('height', nodeH).attr('rx', 4);
      g.append('text').attr('class', 'node-label')
        .attr('x', x + gateW / 2).attr('y', botY + nodeH / 2 + 4)
        .attr('text-anchor', 'middle').text(label);
      if (i > 0) {
        gChart.append('path').attr('class', 'flow').attr('marker-end', 'url(#arr3)')
          .attr('d', `M${(i - 1) * gapX + gateW},${botY + nodeH / 2} L${x - 2},${botY + nodeH / 2}`);
      }
    });
    // lock to output
    const lastX = (gates.length - 1) * gapX + gateW;
    gChart.append('path').attr('class', 'flow').attr('marker-end', 'url(#arr3)')
      .attr('d', `M${lastX},${botY + nodeH / 2} L${outX - 2},${outY + nodeH * 0.7}`);

    // shared output
    gChart.append('rect').attr('class', 'out-rect')
      .attr('x', outX).attr('y', outY).attr('width', outW).attr('height', nodeH).attr('rx', 4)
      .attr('tabindex', 0).attr('role', 'img').attr('aria-label', 'Shared output: a clean SCOPE block');
    gChart.append('text').attr('class', 'node-label')
      .attr('x', outX + outW / 2).attr('y', outY + nodeH / 2 + 4)
      .attr('text-anchor', 'middle').text('SCOPE output');
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
