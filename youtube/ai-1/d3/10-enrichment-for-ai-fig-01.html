<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The three-question audit scorecard</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
    --color-fill:      #F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
      --color-fill:      #1B1B1B;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
         font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: var(--color-secondary); }
  .node-label { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--color-ink); }
  .edge-label { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: var(--color-secondary); }
  .gate-rect { fill: var(--color-fill); stroke: var(--color-ink); stroke-width: 1; }
  .pass-rect { fill: var(--color-fill); stroke: var(--color-ink); stroke-width: 1.5; }
  .fail-rect { fill: var(--color-fill); stroke: var(--color-red); stroke-width: 1.5; }
  .flow-pass { stroke: var(--color-ink); stroke-width: 1.5; fill: none; }
  .flow-fail { stroke: var(--color-red); stroke-width: 1.5; fill: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const gates = [
    { id: 'q1', label: 'Q1 · Transplant test' },
    { id: 'q2', label: 'Q2 · Reader brings something' },
    { id: 'q3', label: 'Q3 · Deliverable is judgment' }
  ];

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const container = document.getElementById('chart');
    const totalWidth = container.clientWidth || 800;
    const totalHeight = Math.max(360, Math.min(460, totalWidth * 0.55));
    const margin = { top: 64, right: 40, bottom: 56, left: 40 };
    const chartWidth = totalWidth - margin.left - margin.right;
    const chartHeight = totalHeight - margin.top - margin.bottom;

    const svg = d3.select('#chart').append('svg')
      .attr('width', totalWidth).attr('height', totalHeight)
      .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
    svg.append('title').attr('id', 'chart-title').text('The three-question audit scorecard');
    svg.append('desc').attr('id', 'chart-desc')
      .text('Three sequential gate nodes pass rightward to a PASS terminal; each gate also drains downward to a single shared FAIL sink, encoding that failing any one question marks an exercise as generic.');

    svg.append('text').attr('x', margin.left).attr('y', 28).attr('class', 'chart-title')
      .text('The three-question audit scorecard');
    svg.append('text').attr('x', margin.left).attr('y', 46).attr('class', 'chart-subtitle')
      .text('Pass all three to reach AI+1 work; fail any one and the exercise is generic.');

    const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

    const nodeW = Math.min(150, (chartWidth - 60) / 4);
    const nodeH = 56;
    const rowY = 20;
    const sinkY = rowY + nodeH + 90;
    const step = (chartWidth - nodeW) / 4;

    const positions = gates.map((g, i) => ({ ...g, x: i * step, y: rowY }));
    const passNode = { id: 'pass', label: 'PASS · AI+1 work', x: 3 * step, y: rowY };
    const sink = { id: 'fail', label: 'FAIL · generic', x: step, y: sinkY };

    const defs = svg.append('defs');
    function marker(id, color) {
      defs.append('marker').attr('id', id).attr('viewBox', '0 0 10 10')
        .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7)
        .attr('orient', 'auto-start-reverse')
        .append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', color);
    }
    marker('arrow-ink', getComputedStyle(document.body).getPropertyValue('--color-ink'));
    marker('arrow-red', getComputedStyle(document.body).getPropertyValue('--color-red'));

    // pass arrows rightward through gates to PASS terminal
    const gEdges = gChart.append('g').attr('class', 'g-edges');
    for (let i = 0; i < 3; i++) {
      const x1 = positions[i].x + nodeW;
      const x2 = (i < 2 ? positions[i + 1].x : passNode.x);
      gEdges.append('path').attr('class', 'flow-pass')
        .attr('marker-end', 'url(#arrow-ink)')
        .attr('d', `M${x1},${rowY + nodeH / 2} L${x2 - 2},${rowY + nodeH / 2}`);
    }
    // downward fail stubs to shared sink
    positions.forEach(p => {
      const sx = p.x + nodeW / 2;
      gEdges.append('path').attr('class', 'flow-fail')
        .attr('marker-end', 'url(#arrow-red)')
        .attr('d', `M${sx},${rowY + nodeH} C${sx},${sinkY - 30} ${sink.x + nodeW / 2},${sinkY - 30} ${sink.x + nodeW / 2},${sinkY - 2}`);
      gEdges.append('text').attr('class', 'edge-label')
        .attr('x', sx + 4).attr('y', rowY + nodeH + 22).text('fails');
    });

    const gNodes = gChart.append('g').attr('class', 'g-nodes');
    function nodeGroup(d, cls) {
      const g = gNodes.append('g')
        .attr('tabindex', 0).attr('role', 'img')
        .attr('aria-label', d.label);
      g.append('rect').attr('class', cls)
        .attr('x', d.x).attr('y', d.y).attr('width', nodeW).attr('height', nodeH).attr('rx', 4);
      const words = d.label.split(' · ');
      words.forEach((w, i) => {
        g.append('text').attr('class', 'node-label')
          .attr('x', d.x + nodeW / 2).attr('y', d.y + nodeH / 2 - 6 + i * 16)
          .attr('text-anchor', 'middle').text(w);
      });
    }
    positions.forEach(p => nodeGroup(p, 'gate-rect'));
    nodeGroup(passNode, 'pass-rect');
    nodeGroup(sink, 'fail-rect');

    gChart.append('text').attr('class', 'edge-label')
      .attr('x', passNode.x + nodeW + 4).attr('y', rowY + nodeH / 2 - 8).text('passes all');
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
