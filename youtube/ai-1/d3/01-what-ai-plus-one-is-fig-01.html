<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generic brief vs. client-informed brief</title>
<style>
  :root {
    --color-white:#FFFFFF; --color-ink:#2a1a0e; --color-red:#C8102E;
    --color-secondary:#545454; --color-border:#D4D4D4; --color-ochre:#C8860E; --color-fill:#F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --color-white:#111111; --color-ink:#F0EBE3; --color-red:#E8243A;
      --color-secondary:#A0978C; --color-border:#2E2E2E; --color-ochre:#D49A30; --color-fill:#1A1A1A; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-sub { font-size: 13px; fill: var(--color-secondary); }
  .col-head { font-size: 12px; font-weight: 700; fill: var(--color-ink); }
  .gap-label { font-size: 11px; fill: var(--color-secondary); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const sections = ['Project overview','Target audience','Brand personality','Deliverables','Timeline','Success metrics'];
const gaps = ['Gradient grudge','PMS green','New VP','No budget number','Three rival shops','Six-person committee'];

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const c = document.getElementById('chart');
  const totalWidth = c.clientWidth || 800;
  const totalHeight = Math.max(380, Math.min(460, totalWidth * 0.55));
  const margin = { top: 72, right: 150, bottom: 24, left: 24 };
  const w = totalWidth - margin.left - margin.right;
  const h = totalHeight - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
  svg.append('title').attr('id','chart-title').text('Generic brief vs. client-informed brief');
  svg.append('desc').attr('id','chart-desc').text('Two document panels: a generic brief with six filled sections and a client-informed brief with faint section content plus markers pointing to required institutional knowledge.');

  svg.append('text').attr('class','chart-title').attr('x',margin.left).attr('y',28).text('Same surface, holes underneath');
  svg.append('text').attr('class','chart-sub').attr('x',margin.left).attr('y',48).text('Where the generic brief goes blank');

  const g = svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);
  const colW = w * 0.42, gap = w * 0.16;
  const rowH = h / sections.length, barH = rowH * 0.62;

  g.append('text').attr('class','col-head').attr('x', colW/2).attr('y',-12).attr('text-anchor','middle').text('Generic brief');
  g.append('text').attr('class','col-head').attr('x', colW + gap + colW/2).attr('y',-12).attr('text-anchor','middle').text('Client-informed brief');

  const tip = d3.select('body').append('div').attr('class','tooltip')
    .style('position','absolute').style('pointer-events','none').style('opacity',0)
    .style('background','var(--color-white)').style('border','1px solid var(--color-border)')
    .style('padding','6px 10px').style('font',"13px 'Inter',sans-serif").style('color','var(--color-ink)');

  sections.forEach((s, i) => {
    const y = i*rowH + (rowH-barH)/2;
    // left: filled
    g.append('rect').attr('x',0).attr('y',y).attr('width',colW).attr('height',barH).attr('rx',4)
      .attr('fill','var(--color-fill)').attr('stroke','var(--color-ink)').attr('stroke-width',1)
      .attr('tabindex',0).attr('role','img').attr('aria-label',`${s}: filled, generic`)
      .on('mouseover',(e)=>tip.html(`<strong>${s}</strong><br>generic — filled`).transition().duration(150).style('opacity',1))
      .on('mousemove',(e)=>tip.style('left',(e.pageX+12)+'px').style('top',(e.pageY-28)+'px'))
      .on('mouseout',()=>tip.transition().duration(100).style('opacity',0));
    g.append('text').attr('x',8).attr('y',y+barH/2+4).attr('class','gap-label').attr('fill','var(--color-ink)').text(s);

    // right: same skeleton + hollow gap marker
    const rx = colW + gap;
    g.append('rect').attr('x',rx).attr('y',y).attr('width',colW).attr('height',barH).attr('rx',4)
      .attr('fill','var(--color-fill)').attr('stroke','var(--color-secondary)').attr('stroke-width',1);
    // hollow gap ring in margin + leader
    const ringX = rx + colW + 18, ringY = y + barH/2;
    g.append('line').attr('x1', rx+colW).attr('y1', ringY).attr('x2', ringX-7).attr('y2', ringY)
      .attr('stroke','var(--color-ink)').attr('stroke-width',1).attr('aria-hidden','true');
    g.append('circle').attr('cx',ringX).attr('cy',ringY).attr('r',6)
      .attr('fill','none').attr('stroke','var(--color-ochre)').attr('stroke-width',2)
      .attr('tabindex',0).attr('role','img').attr('aria-label',`Knowledge gap: ${gaps[i]}`)
      .on('mouseover',(e)=>tip.html(`<strong>Knowledge gap</strong><br>${gaps[i]}`).transition().duration(150).style('opacity',1))
      .on('mousemove',(e)=>tip.style('left',(e.pageX+12)+'px').style('top',(e.pageY-28)+'px'))
      .on('mouseout',()=>tip.transition().duration(100).style('opacity',0));
    g.append('text').attr('class','gap-label').attr('x',ringX+12).attr('y',ringY+4).text(gaps[i]);
  });
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
