<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 4.1 — The three-phase Tic TOC pipeline</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
    --color-fill:      #F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
      --color-fill:      #1A1A1A;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
         font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; fill: var(--color-secondary); }
  .node-label { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; fill: var(--color-ink); }
  .tick-label { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0;
             background: var(--color-white); color: var(--color-ink);
             border: 1px solid var(--color-border); border-radius: 8px;
             padding: 8px 10px; font-size: 13px; max-width: 240px;
             box-shadow: 0 6px 20px -6px rgb(18 18 18 / 0.14); }
  .node-rect { transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const stageData = [
  { id: 'p1', label: 'Phase One', sub: 'i1 i2 i3 i4', kind: 'phase', desc: 'Intake — what you know about your book (commands /i1 through /i4).' },
  { id: 'p2', label: 'Phase Two', sub: 'l1 l2 l3 l4', kind: 'phase', desc: 'The pedagogical spine — outcomes, sequence, arc, prerequisites (/l1 through /l4).' },
  { id: 'p3', label: 'Phase Three', sub: 'c1 c2 c3 c4', kind: 'phase', desc: 'Chapter architecture Cowork will draft against (/c1 through /c4).' },
  { id: 'g2', label: '/g2 gate', sub: '', kind: 'gate', desc: 'The 7 Adoption Failure Mode diagnostic. Re-run on warnings, advance when clean.' },
  { id: 'co', label: 'Cowork', sub: 'handoff', kind: 'terminal', desc: 'Downstream execution system that drafts against the finished TIKTOC.md.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const margin = { top: 64, right: 40, bottom: 56, left: 40 };
  const container = document.getElementById('chart');
  const totalWidth = container.clientWidth || 800;
  const totalHeight = 360;
  const chartWidth = totalWidth - margin.left - margin.right;
  const chartHeight = totalHeight - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text('The three-phase Tic TOC pipeline');
  svg.append('desc').attr('id', 'chart-desc').text('Three sequential phase blocks feed a /g2 diagnostic gate that loops back on warnings and forwards to the Cowork handoff.');

  svg.append('text').attr('class', 'chart-title').attr('x', margin.left).attr('y', 24).text('The three-phase Tic TOC pipeline');
  svg.append('text').attr('class', 'chart-subtitle').attr('x', margin.left).attr('y', 44).text('Three gated stages → /g2 diagnostic → Cowork handoff');

  const gChart = svg.append('g').attr('class', 'g-chart').attr('transform', `translate(${margin.left},${margin.top})`);

  const n = stageData.length;
  const slot = chartWidth / n;
  const boxW = Math.min(slot * 0.72, 150);
  const boxH = 88;
  const cy = chartHeight / 2;
  stageData.forEach((d, i) => { d.cx = slot * i + slot / 2; });

  // connecting arrows
  const defs = svg.append('defs');
  defs.append('marker').attr('id', 'arrow').attr('viewBox', '0 0 10 10')
    .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto-start-reverse')
    .append('path').attr('d', 'M0,0 L10,5 L0,10 Z').attr('fill', 'var(--color-ink)');

  const gAxes = gChart.append('g').attr('aria-hidden', 'true');
  for (let i = 0; i < n - 1; i++) {
    const a = stageData[i], b = stageData[i + 1];
    gAxes.append('line')
      .attr('x1', a.cx + boxW / 2).attr('y1', cy)
      .attr('x2', b.cx - boxW / 2 - 4).attr('y2', cy)
      .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1).attr('marker-end', 'url(#arrow)');
  }
  // re-run loop from gate back to phase three
  const gate = stageData[3], p3 = stageData[2];
  gAxes.append('path')
    .attr('d', `M${gate.cx},${cy - boxH / 2} C${gate.cx},${cy - boxH} ${p3.cx},${cy - boxH} ${p3.cx},${cy - boxH / 2 - 2}`)
    .attr('fill', 'none').attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1)
    .attr('stroke-dasharray', '4 3').attr('marker-end', 'url(#arrow)');
  gAxes.append('text').attr('class', 'tick-label').attr('x', (gate.cx + p3.cx) / 2).attr('y', cy - boxH - 4)
    .attr('text-anchor', 'middle').text('re-run');

  const fillFor = k => k === 'gate' ? 'var(--color-red)' : k === 'terminal' ? 'var(--color-ink)' : 'var(--color-fill)';
  const textFor = k => (k === 'gate' || k === 'terminal') ? 'var(--color-white)' : 'var(--color-ink)';

  const gNodes = gChart.append('g');
  const nodes = gNodes.selectAll('.node-g').data(stageData).join('g').attr('class', 'node-g')
    .attr('tabindex', 0).attr('role', 'listitem')
    .attr('aria-label', d => `${d.label}: ${d.desc}`);

  nodes.each(function(d) {
    const g = d3.select(this);
    if (d.kind === 'gate') {
      const r = boxH / 2;
      g.append('polygon').attr('class', 'node-rect')
        .attr('points', `${d.cx},${cy - r} ${d.cx + r},${cy} ${d.cx},${cy + r} ${d.cx - r},${cy}`)
        .attr('fill', fillFor(d.kind)).attr('stroke', 'var(--color-ink)').attr('stroke-width', 1);
    } else {
      g.append('rect').attr('class', 'node-rect')
        .attr('x', d.cx - boxW / 2).attr('y', cy - boxH / 2).attr('width', boxW).attr('height', boxH)
        .attr('rx', 8).attr('fill', fillFor(d.kind)).attr('stroke', 'var(--color-ink)').attr('stroke-width', 1);
    }
    g.append('text').attr('class', 'node-label').attr('x', d.cx).attr('y', cy - 2)
      .attr('text-anchor', 'middle').attr('fill', textFor(d.kind)).style('font-weight', 600).text(d.label);
    if (d.sub) {
      // command sub-ticks for phase blocks
      if (d.kind === 'phase') {
        const ticks = d.sub.split(' ');
        const tw = boxW * 0.6, tx0 = d.cx - tw / 2, step = tw / (ticks.length - 1);
        ticks.forEach((t, i) => {
          g.append('line').attr('aria-hidden', 'true').attr('x1', tx0 + step * i).attr('x2', tx0 + step * i)
            .attr('y1', cy + 14).attr('y2', cy + 24).attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1.5);
        });
      } else {
        g.append('text').attr('class', 'tick-label').attr('x', d.cx).attr('y', cy + 16)
          .attr('text-anchor', 'middle').attr('fill', textFor(d.kind)).text(d.sub);
      }
    }
  });

  function show(event, d) { tooltip.html(`<strong>${d.label}</strong><br>${d.desc}`)
    .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
    .transition().duration(150).style('opacity', 1); }
  function move(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
  function hide() { tooltip.transition().duration(100).style('opacity', 0); }

  nodes.on('mouseover', function(event, d) { d3.select(this).select('.node-rect').attr('opacity', 1); nodes.selectAll('.node-rect').filter(x => x !== d).attr('opacity', 0.35); show(event, d); })
    .on('mousemove', move)
    .on('mouseout', function() { nodes.selectAll('.node-rect').attr('opacity', 1); hide(); })
    .on('focus', function(event, d) { show(event, d); })
    .on('blur', hide);
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
