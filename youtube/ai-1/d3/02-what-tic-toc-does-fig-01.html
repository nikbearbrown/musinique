<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The TIKTOC.md document map</title>
<style>
  :root {
    --color-white:#FFFFFF; --color-ink:#2a1a0e; --color-red:#C8102E;
    --color-secondary:#545454; --color-border:#D4D4D4; --color-ochre:#C8860E; --color-fill:#F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --color-white:#111111; --color-ink:#F0EBE3; --color-red:#E8243A;
      --color-secondary:#A0978C; --color-border:#2E2E2E; --color-ochre:#D49A30; --color-fill:#1A1A1A; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-sub { font-size: 13px; fill: var(--color-secondary); }
  .part-num { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; font-size: 11px; }
  .part-label { font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const parts = [
  { n:1, label:'Book concept and thesis', shown:true },
  { n:2, label:'Learner profile',          shown:true },
  { n:3, label:'Book type and deployment specification', shown:false },
  { n:4, label:'Field positioning',        shown:false },
  { n:5, label:'Three-act learning arc',   shown:false },
  { n:6, label:'Prerequisite map',         shown:false },
  { n:7, label:'Learning outcomes by chapter', shown:true },
  { n:8, label:'Chapter-by-chapter TOC',    shown:true }
];

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const c = document.getElementById('chart');
  const totalWidth = c.clientWidth || 800;
  const totalHeight = Math.max(440, Math.min(560, totalWidth * 0.7));
  const margin = { top: 64, right: 40, bottom: 24, left: 60 };
  const w = totalWidth - margin.left - margin.right;
  const h = totalHeight - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
  svg.append('title').attr('id','chart-title').text('The TIKTOC.md document map');
  svg.append('desc').attr('id','chart-desc').text('Eight Part boxes stacked top to bottom on a spine; Parts 1, 2, 7 and 8 are filled because the chapter excerpts them, and Parts 3 through 6 are hollow but labeled.');

  svg.append('text').attr('class','chart-title').attr('x',margin.left-20).attr('y',26).text('TIKTOC.md structure');
  svg.append('text').attr('class','chart-sub').attr('x',margin.left-20).attr('y',46).text('Eight Parts; filled = excerpted in chapter, hollow = structure exists');

  const g = svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);
  const rowH = h / parts.length, boxH = rowH*0.7, boxW = w*0.86, spineX = -20;

  g.append('line').attr('x1',spineX).attr('y1',rowH/2).attr('x2',spineX).attr('y2', (parts.length-0.5)*rowH)
    .attr('stroke','var(--color-ink)').attr('stroke-width',1).attr('aria-hidden','true');

  const tip = d3.select('body').append('div').attr('class','tooltip')
    .style('position','absolute').style('pointer-events','none').style('opacity',0)
    .style('background','var(--color-white)').style('border','1px solid var(--color-border)')
    .style('padding','6px 10px').style('font',"13px 'Inter',sans-serif").style('color','var(--color-ink)');

  const sel = g.selectAll('.part').data(parts).join('g')
    .attr('transform',(d,i)=>`translate(0,${i*rowH+(rowH-boxH)/2})`)
    .attr('tabindex',0).attr('role','listitem')
    .attr('aria-label',d=>`Part ${d.n}: ${d.label}${d.shown?'':'; not excerpted in chapter'}`);
  sel.append('line').attr('x1',spineX).attr('y1',boxH/2).attr('x2',0).attr('y2',boxH/2)
    .attr('stroke','var(--color-ink)').attr('stroke-width',1).attr('aria-hidden','true');
  sel.append('rect').attr('width',boxW).attr('height',boxH).attr('rx',6)
    .attr('fill',d=>d.shown?'var(--color-fill)':'none')
    .attr('stroke',d=>d.shown?'var(--color-ink)':'var(--color-secondary)')
    .attr('stroke-width',1.5).attr('stroke-dasharray',d=>d.shown?null:'4 3');
  sel.append('text').attr('class','part-num').attr('x',12).attr('y',boxH/2+4)
    .attr('fill',d=>d.shown?'var(--color-red)':'var(--color-secondary)').text(d=>'Part '+d.n);
  sel.append('text').attr('class','part-label').attr('x',78).attr('y',boxH/2+4)
    .attr('fill',d=>d.shown?'var(--color-ink)':'var(--color-secondary)')
    .text(d=>d.label);
  sel.on('mouseover',(e,d)=>tip.html(`<strong>Part ${d.n}</strong><br>${d.label}${d.shown?'':'<br><em>not excerpted in chapter</em>'}`).transition().duration(150).style('opacity',1))
     .on('mousemove',(e)=>tip.style('left',(e.pageX+12)+'px').style('top',(e.pageY-28)+'px'))
     .on('mouseout',()=>tip.transition().duration(100).style('opacity',0));
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
