<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 4.3 — Bloom's verb ceiling for a practitioner handbook</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
    --color-fill:      #F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
      --color-fill:      #1A1A1A;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
         font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-size: 13px; fill: var(--color-secondary); }
  .axis-title { font-size: 12px; fill: var(--color-secondary); }
  .tick-label, .axis text { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; font-size: 11px; fill: var(--color-secondary); }
  .floor-label { font-size: 12px; fill: var(--color-red); font-weight: 600; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0;
             background: var(--color-white); color: var(--color-ink);
             border: 1px solid var(--color-border); border-radius: 8px;
             padding: 8px 10px; font-size: 13px; max-width: 240px;
             box-shadow: 0 6px 20px -6px rgb(18 18 18 / 0.14); }
  .bar-rect { transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const barData = [
  { level: 'Remember',   rank: 1, below: true,  desc: 'Recall facts. Lowest ceiling — below the working floor.' },
  { level: 'Understand', rank: 2, below: true,  desc: 'Explain. A low-ceiling verb; below the practitioner floor.' },
  { level: 'Apply',      rank: 3, below: false, desc: 'Do it once in a constrained context. The working floor of a useful handbook.' },
  { level: 'Analyze',    rank: 4, below: false, desc: 'Break down and distinguish. At or above the floor.' },
  { level: 'Evaluate',   rank: 5, below: false, desc: 'Judge against criteria. A high-judgment ceiling.' },
  { level: 'Create',     rank: 6, below: false, desc: 'Produce something new. The highest judgment ceiling.' }
];
const FLOOR_RANK = 3;

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const margin = { top: 64, right: 40, bottom: 64, left: 64 };
  const container = document.getElementById('chart');
  const totalWidth = container.clientWidth || 800;
  const totalHeight = 420;
  const chartWidth = totalWidth - margin.left - margin.right;
  const chartHeight = totalHeight - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text("Bloom's verb ceiling for a practitioner handbook");
  svg.append('desc').attr('id', 'chart-desc').text('Six bars rising in taxonomy order encode cognitive ceiling; a threshold line at Apply marks the practitioner-handbook working floor.');

  svg.append('text').attr('class', 'chart-title').attr('x', margin.left).attr('y', 24).text("Bloom's verb ceiling");
  svg.append('text').attr('class', 'chart-subtitle').attr('x', margin.left).attr('y', 44).text('No chapter outcome below Apply as its ceiling');

  const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const xScaleBand = d3.scaleBand().domain(barData.map(d => d.level)).range([0, chartWidth]).padding(0.2);
  const yScaleLinear = d3.scaleLinear().domain([0, 6]).range([chartHeight, 0]);

  const gGrid = gChart.append('g').attr('aria-hidden', 'true');
  yScaleLinear.ticks(6).forEach(t => {
    gGrid.append('line').attr('x1', 0).attr('x2', chartWidth).attr('y1', yScaleLinear(t)).attr('y2', yScaleLinear(t))
      .attr('stroke', 'var(--color-border)').attr('stroke-opacity', 0.6).attr('stroke-width', 1);
  });

  const gBars = gChart.append('g');
  gBars.selectAll('.bar-rect').data(barData).join('rect')
    .attr('class', 'bar-rect')
    .attr('x', d => xScaleBand(d.level)).attr('width', xScaleBand.bandwidth())
    .attr('y', d => yScaleLinear(d.rank)).attr('height', d => chartHeight - yScaleLinear(d.rank))
    .attr('fill', 'var(--color-red)').attr('fill-opacity', d => d.below ? 0.4 : 1)
    .attr('tabindex', 0).attr('role', 'img')
    .attr('aria-label', d => `${d.level}: ${d.desc}`);

  // x axis labels
  const gAxes = gChart.append('g').attr('class', 'axis');
  barData.forEach(d => {
    gAxes.append('text').attr('class', 'tick-label').attr('x', xScaleBand(d.level) + xScaleBand.bandwidth() / 2)
      .attr('y', chartHeight + 18).attr('text-anchor', 'middle').text(d.level);
  });

  // threshold floor line at Apply (top of the Apply bar)
  const floorY = yScaleLinear(FLOOR_RANK);
  gChart.append('line').attr('x1', 0).attr('x2', chartWidth).attr('y1', floorY).attr('y2', floorY)
    .attr('stroke', 'var(--color-red)').attr('stroke-width', 2).attr('stroke-dasharray', '6 4').attr('aria-hidden', 'true');
  gChart.append('text').attr('class', 'floor-label').attr('x', chartWidth).attr('y', floorY - 6)
    .attr('text-anchor', 'end').text('working floor');

  svg.append('text').attr('class', 'axis-title').attr('transform', `translate(16,${margin.top + chartHeight / 2}) rotate(-90)`)
    .attr('text-anchor', 'middle').text('cognitive ceiling');

  function show(event, d) { tooltip.html(`<strong>${d.level}</strong><br>${d.desc}`)
    .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
    .transition().duration(150).style('opacity', 1); }
  function move(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
  function hide() { tooltip.transition().duration(100).style('opacity', 0); }

  gBars.selectAll('.bar-rect')
    .on('mouseover', function(event, d) { gBars.selectAll('.bar-rect').attr('opacity', 0.35); d3.select(this).attr('opacity', 1); show(event, d); })
    .on('mousemove', move)
    .on('mouseout', function() { gBars.selectAll('.bar-rect').attr('opacity', 1); hide(); })
    .on('focus', function(event, d) { show(event, d); }).on('blur', hide);
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
