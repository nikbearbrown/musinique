<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Author's outline vs. TIKTOC.md specification</title>
<style>
  :root {
    --color-white:#FFFFFF; --color-ink:#2a1a0e; --color-red:#C8102E;
    --color-secondary:#545454; --color-border:#D4D4D4; --color-ochre:#C8860E; --color-fill:#F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --color-white:#111111; --color-ink:#F0EBE3; --color-red:#E8243A;
      --color-secondary:#A0978C; --color-border:#2E2E2E; --color-ochre:#D49A30; --color-fill:#1A1A1A; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-sub { font-size: 13px; fill: var(--color-secondary); }
  .col-head { font-size: 12px; font-weight: 700; fill: var(--color-ink); }
  .row-label { font-size: 12px; fill: var(--color-ink); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const rows = [
  'What it specifies','Who the audience is','What the reader can do',
  'Cognitive level required','Chapter-to-chapter logic','Executable without clarification'
];

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const c = document.getElementById('chart');
  const totalWidth = c.clientWidth || 800;
  const totalHeight = Math.max(380, Math.min(460, totalWidth * 0.55));
  const margin = { top: 76, right: 30, bottom: 24, left: 200 };
  const w = totalWidth - margin.left - margin.right;
  const h = totalHeight - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
  svg.append('title').attr('id','chart-title').text('Author outline vs. TIKTOC.md specification');
  svg.append('desc').attr('id','chart-desc').text('A six-row feature matrix; outline cells are hollow to mark deferred features, TIKTOC.md cells are filled to mark resolved features.');

  svg.append('text').attr('class','chart-title').attr('x',20).attr('y',26).text('Outline defers; the specification resolves');
  svg.append('text').attr('class','chart-sub').attr('x',20).attr('y',46).text('Hollow = deferred, filled = resolved');

  const g = svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);
  const colW = (w-20)/2, gap = 20, rowH = h/rows.length, cellH = rowH*0.66;

  g.append('text').attr('class','col-head').attr('x',colW/2).attr('y',-14).attr('text-anchor','middle').text('Outline');
  g.append('text').attr('class','col-head').attr('x',colW+gap+colW/2).attr('y',-14).attr('text-anchor','middle').text('TIKTOC.md');
  g.append('line').attr('x1',colW+gap/2).attr('y1',-30).attr('x2',colW+gap/2).attr('y2',h).attr('stroke','var(--color-border)').attr('stroke-width',1).attr('aria-hidden','true');

  const tip = d3.select('body').append('div').attr('class','tooltip')
    .style('position','absolute').style('pointer-events','none').style('opacity',0)
    .style('background','var(--color-white)').style('border','1px solid var(--color-border)')
    .style('padding','6px 10px').style('font',"13px 'Inter',sans-serif").style('color','var(--color-ink)');

  rows.forEach((r,i)=>{
    const y = i*rowH + (rowH-cellH)/2;
    g.append('text').attr('class','row-label').attr('x',-12).attr('y',y+cellH/2+4).attr('text-anchor','end').text(r);
    // outline = hollow
    g.append('rect').attr('x',0).attr('y',y).attr('width',colW).attr('height',cellH).attr('rx',4)
      .attr('fill','none').attr('stroke','var(--color-secondary)').attr('stroke-width',1).attr('stroke-dasharray','4 3')
      .attr('tabindex',0).attr('role','img').attr('aria-label',`${r}: outline, deferred`)
      .on('mouseover',(e)=>tip.html(`<strong>${r}</strong><br>outline — deferred`).transition().duration(150).style('opacity',1))
      .on('mousemove',(e)=>tip.style('left',(e.pageX+12)+'px').style('top',(e.pageY-28)+'px'))
      .on('mouseout',()=>tip.transition().duration(100).style('opacity',0));
    // TIKTOC = filled
    g.append('rect').attr('x',colW+gap).attr('y',y).attr('width',colW).attr('height',cellH).attr('rx',4)
      .attr('fill','var(--color-red)').attr('stroke','var(--color-red)').attr('stroke-width',1)
      .attr('tabindex',0).attr('role','img').attr('aria-label',`${r}: TIKTOC.md, resolved`)
      .on('mouseover',(e)=>tip.html(`<strong>${r}</strong><br>TIKTOC.md — resolved`).transition().duration(150).style('opacity',1))
      .on('mousemove',(e)=>tip.style('left',(e.pageX+12)+'px').style('top',(e.pageY-28)+'px'))
      .on('mouseout',()=>tip.transition().duration(100).style('opacity',0));
  });
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
