<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compression funnel: 3 outputs to synthesis to /i1 brief</title>
<style>
  :root {
    --color-white:#FFFFFF; --color-ink:#2a1a0e; --color-red:#C8102E;
    --color-secondary:#545454; --color-border:#D4D4D4; --color-ochre:#C8860E; --color-fill:#F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --color-white:#111111; --color-ink:#F0EBE3; --color-red:#E8243A;
      --color-secondary:#A0978C; --color-border:#2E2E2E; --color-ochre:#D49A30; --color-fill:#1A1A1A; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-sub { font-size: 13px; fill: var(--color-secondary); }
  .stage-label { font-size: 11px; fill: var(--color-ink); }
  .stage-count { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; font-size: 10px; fill: var(--color-secondary); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
// proportional by word count
const stages = [
  { id:'inputs',    label:'3 LLM outputs', words:9000, count:'~3,000 ea (3)', color:'var(--color-secondary)' },
  { id:'synthesis', label:'Synthesis',     words:700,  count:'600–800',       color:'var(--color-ochre)' },
  { id:'brief',     label:'/i1 brief',     words:1050, count:'700–1,400',     color:'var(--color-red)' }
];
const questions = ['who','risk','why now','gap'];

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const c = document.getElementById('chart');
  const totalWidth = c.clientWidth || 800;
  const totalHeight = Math.max(360, Math.min(440, totalWidth * 0.5));
  const margin = { top: 64, right: 90, bottom: 56, left: 30 };
  const w = totalWidth - margin.left - margin.right;
  const h = totalHeight - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role','img').attr('aria-labelledby','chart-title chart-desc');
  svg.append('title').attr('id','chart-title').text('Compression funnel from three LLM outputs to the i1 brief');
  svg.append('desc').attr('id','chart-desc').text('Three large LLM-output slabs compress to a small synthesis block and then to a four-section brief, with heights scaled to word counts, fanning to four intake questions.');

  svg.append('text').attr('class','chart-title').attr('x',margin.left).attr('y',26).text('The compression is the work');
  svg.append('text').attr('class','chart-sub').attr('x',margin.left).attr('y',46).text('Heights scaled to word count');

  const g = svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);
  const slotW = w/3, blockW = slotW*0.5;
  const maxWords = d3.max(stages, d=>d.words);
  const hScale = d3.scaleLinear().domain([0, maxWords]).range([0, h*0.86]);
  const cy = h/2;

  const tip = d3.select('body').append('div').attr('class','tooltip')
    .style('position','absolute').style('pointer-events','none').style('opacity',0)
    .style('background','var(--color-white)').style('border','1px solid var(--color-border)')
    .style('padding','6px 10px').style('font',"13px 'Inter',sans-serif").style('color','var(--color-ink)');

  const bx = i => i*slotW + (slotW-blockW)/2;
  // flow connectors
  for(let i=0;i<stages.length-1;i++){
    const x1=bx(i)+blockW, x2=bx(i+1);
    const h1=hScale(stages[i].words), h2=hScale(stages[i+1].words);
    g.append('path').attr('d',`M ${x1} ${cy-h1/2} L ${x2} ${cy-h2/2} L ${x2} ${cy+h2/2} L ${x1} ${cy+h1/2} Z`)
      .attr('fill','var(--color-fill)').attr('stroke','none').attr('aria-hidden','true');
  }

  stages.forEach((s,i)=>{
    const bh = hScale(s.words);
    g.append('rect').attr('x',bx(i)).attr('y',cy-bh/2).attr('width',blockW).attr('height',bh).attr('rx',6)
      .attr('fill',s.color)
      .attr('tabindex',0).attr('role','img').attr('aria-label',`${s.label}: ${s.count} words`)
      .on('mouseover',(e)=>tip.html(`<strong>${s.label}</strong><br>${s.count} words`).transition().duration(150).style('opacity',1))
      .on('mousemove',(e)=>tip.style('left',(e.pageX+12)+'px').style('top',(e.pageY-28)+'px'))
      .on('mouseout',()=>tip.transition().duration(100).style('opacity',0));
    g.append('text').attr('class','stage-label').attr('x',bx(i)+blockW/2).attr('y',cy-bh/2-18).attr('text-anchor','middle').text(s.label);
    g.append('text').attr('class','stage-count').attr('x',bx(i)+blockW/2).attr('y',cy-bh/2-4).attr('text-anchor','middle').text(s.count);
  });

  // fan to four questions
  const lastX = bx(2)+blockW;
  const qx = w+8;
  questions.forEach((q,i)=>{
    const qy = (i+0.5)*(h/questions.length);
    g.append('path').attr('d',`M ${lastX} ${cy} L ${qx-6} ${qy}`).attr('stroke','var(--color-secondary)').attr('stroke-width',1).attr('fill','none').attr('aria-hidden','true');
    g.append('circle').attr('cx',qx).attr('cy',qy).attr('r',4).attr('fill','none').attr('stroke','var(--color-ink)').attr('stroke-width',1.5)
      .attr('tabindex',0).attr('role','img').attr('aria-label',`Intake question: ${q}`);
    g.append('text').attr('class','stage-count').attr('x',qx+10).attr('y',qy+4).text(q);
  });
}
draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
