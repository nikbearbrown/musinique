<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 5.1 — The scaffold directory tree by audience</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
    --color-fill:      #F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
      --color-fill:      #1A1A1A;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
         font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-size: 13px; fill: var(--color-secondary); }
  .node-label { font-size: 12px; fill: var(--color-ink); }
  .legend-label { font-size: 12px; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0;
             background: var(--color-white); color: var(--color-ink);
             border: 1px solid var(--color-border); border-radius: 8px;
             padding: 8px 10px; font-size: 13px; max-width: 260px;
             box-shadow: 0 6px 20px -6px rgb(18 18 18 / 0.14); }
  .node-rect { transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const nodes = [
  { id: 'root', label: 'ai-for-designers/', audience: 'root', depth: 0,
    desc: 'The project root folder generated by new_book.py.' },
  { id: 'cowork', label: 'Cowork-facing', audience: 'cowork', depth: 1,
    desc: 'TIKTOC.md, book.md, pantry/ — read by the automation at draft time.' },
  { id: 'human', label: 'Human-facing', audience: 'human', depth: 1,
    desc: 'vision.md, architecture.md, chapters-spec.md, risks.md, outline.md, README.md — your working notebook.' },
  { id: 'build', label: 'Build-facing', audience: 'build', depth: 1,
    desc: 'metadata.yaml, build.sh, images/, d3/, styles/, output/, _working/ — feed the EPUB and PDF pipeline.' },
  { id: 'chapters', label: 'chapters/', audience: 'dual', depth: 1,
    desc: 'Cowork writes here; the build script reads here. Two audiences.' }
];
const audienceColor = {
  root: 'var(--color-ink)', cowork: 'var(--color-red)',
  human: 'var(--color-secondary)', build: 'var(--color-ochre)', dual: 'var(--color-red)'
};
const legend = [
  { k: 'cowork', t: 'Cowork-facing' },
  { k: 'human', t: 'Human-facing' },
  { k: 'build', t: 'Build-facing' },
  { k: 'dual', t: 'Shared (chapters/)' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const margin = { top: 84, right: 24, bottom: 24, left: 40 };
  const container = document.getElementById('chart');
  const totalWidth = container.clientWidth || 800;
  const rowH = 52;
  const totalHeight = margin.top + nodes.length * rowH + margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text('The scaffold directory tree by audience');
  svg.append('desc').attr('id', 'chart-desc').text('A directory tree color-coded into three audiences — Cowork, human, build — with chapters/ shared between two.');

  svg.append('text').attr('class', 'chart-title').attr('x', 16).attr('y', 24).text('Directory tree by audience');
  svg.append('text').attr('class', 'chart-subtitle').attr('x', 16).attr('y', 44).text('Once you see the three audiences, the rest reads itself');

  // legend
  const gLegend = svg.append('g').attr('transform', `translate(16,58)`);
  let lx = 0;
  legend.forEach(l => {
    gLegend.append('rect').attr('x', lx).attr('y', -10).attr('width', 12).attr('height', 12)
      .attr('rx', 2).attr('fill', audienceColor[l.k]).attr('aria-hidden', 'true');
    const txt = gLegend.append('text').attr('class', 'legend-label').attr('x', lx + 18).attr('y', 0).text(l.t);
    lx += 28 + l.t.length * 6.5;
  });

  const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  const indent = 36, boxH = 34, boxW = 200;
  nodes.forEach((d, i) => { d.x = d.depth * indent; d.y = i * rowH; });

  // tree elbow connectors from root to children
  const gAxes = gChart.append('g').attr('aria-hidden', 'true');
  const root = nodes[0];
  nodes.filter(d => d.depth === 1).forEach(d => {
    gAxes.append('path').attr('fill', 'none').attr('stroke', 'var(--color-border)').attr('stroke-width', 1)
      .attr('d', `M${root.x + 10},${root.y + boxH} V${d.y + boxH / 2} H${d.x}`);
  });

  const g = gChart.selectAll('.node-g').data(nodes).join('g').attr('class', 'node-g')
    .attr('tabindex', 0).attr('role', 'img').attr('aria-label', d => `${d.label}: ${d.desc}`);

  g.each(function(d) {
    const sel = d3.select(this);
    if (d.audience === 'dual') {
      // split fill: half red, half ochre
      sel.append('rect').attr('class', 'node-rect').attr('x', d.x).attr('y', d.y).attr('width', boxW / 2).attr('height', boxH)
        .attr('fill', 'var(--color-red)').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1);
      sel.append('rect').attr('class', 'node-rect').attr('x', d.x + boxW / 2).attr('y', d.y).attr('width', boxW / 2).attr('height', boxH)
        .attr('fill', 'var(--color-ochre)').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1);
      sel.append('rect').attr('x', d.x).attr('y', d.y).attr('width', boxW).attr('height', boxH)
        .attr('rx', 4).attr('fill', 'none').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1).attr('aria-hidden', 'true');
    } else {
      sel.append('rect').attr('class', 'node-rect').attr('x', d.x).attr('y', d.y).attr('width', boxW).attr('height', boxH)
        .attr('rx', 4).attr('fill', audienceColor[d.audience]).attr('fill-opacity', d.audience === 'root' ? 1 : 0.85)
        .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1);
    }
    sel.append('text').attr('class', 'node-label').attr('x', d.x + 10).attr('y', d.y + boxH / 2 + 4)
      .attr('fill', (d.audience === 'human') ? 'var(--color-white)' : 'var(--color-white)').text(d.label);
  });

  function show(event, d) { tooltip.html(`<strong>${d.label}</strong><br>${d.desc}`)
    .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
    .transition().duration(150).style('opacity', 1); }
  function move(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
  function hide() { tooltip.transition().duration(100).style('opacity', 0); }

  g.on('mouseover', function(event, d) { g.selectAll('.node-rect').attr('opacity', 0.35); d3.select(this).selectAll('.node-rect').attr('opacity', 1); show(event, d); })
    .on('mousemove', move)
    .on('mouseout', function() { g.selectAll('.node-rect').attr('opacity', 1); hide(); })
    .on('focus', function(event, d) { show(event, d); }).on('blur', hide);
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
