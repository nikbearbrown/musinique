<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 5.2 — TIKTOC.md → new_book.py → directory</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
    --color-fill:      #F5F5F5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
      --color-fill:      #1A1A1A;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
         font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; }
  #chart { width: 100%; }
  .chart-title { font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-size: 13px; fill: var(--color-secondary); }
  .node-label { font-size: 12px; fill: var(--color-ink); }
  .tick-label { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; font-size: 11px; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0;
             background: var(--color-white); color: var(--color-ink);
             border: 1px solid var(--color-border); border-radius: 8px;
             padding: 8px 10px; font-size: 13px; max-width: 240px;
             box-shadow: 0 6px 20px -6px rgb(18 18 18 / 0.14); }
  .node-rect { transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const stages = [
  { id: 'spec', label: 'TIKTOC.md', kind: 'input', desc: 'The spec from Chapter 4 — chapter list, metadata, three-act arc, capability statements.' },
  { id: 'proc', label: 'new_book.py', kind: 'process', desc: 'Reads the spec, refuses to overwrite, scaffolds the directory in about thirty seconds.' },
  { id: 'dir', label: 'directory', kind: 'output', desc: 'The generated project folder — files and folders mirroring the spec.' }
];
const args = [
  { id: 'a1', label: '--tiktoc', desc: 'Points to the TIKTOC.md file the script reads.' },
  { id: 'a2', label: '--slug', desc: 'The directory name, baked into every path; choose once.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const margin = { top: 64, right: 40, bottom: 80, left: 40 };
  const container = document.getElementById('chart');
  const totalWidth = container.clientWidth || 800;
  const totalHeight = 340;
  const chartWidth = totalWidth - margin.left - margin.right;
  const chartHeight = totalHeight - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text('TIKTOC.md to new_book.py to directory');
  svg.append('desc').attr('id', 'chart-desc').text('The spec plus two arguments feed the scaffold script, which refuses to overwrite and produces a project directory.');

  svg.append('text').attr('class', 'chart-title').attr('x', margin.left).attr('y', 24).text('From spec to directory');
  svg.append('text').attr('class', 'chart-subtitle').attr('x', margin.left).attr('y', 44).text('Two arguments. The directory is the spec made legible.');

  const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  const n = stages.length;
  const slot = chartWidth / n;
  const boxW = Math.min(slot * 0.66, 150), boxH = 72;
  const cy = chartHeight / 2 - 10;
  stages.forEach((d, i) => { d.cx = slot * i + slot / 2; });

  const defs = svg.append('defs');
  defs.append('marker').attr('id', 'arrow5').attr('viewBox', '0 0 10 10')
    .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto-start-reverse')
    .append('path').attr('d', 'M0,0 L10,5 L0,10 Z').attr('fill', 'var(--color-ink)');

  const gAxes = gChart.append('g').attr('aria-hidden', 'true');
  for (let i = 0; i < n - 1; i++) {
    gAxes.append('line').attr('x1', stages[i].cx + boxW / 2).attr('y1', cy)
      .attr('x2', stages[i + 1].cx - boxW / 2 - 4).attr('y2', cy)
      .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1).attr('marker-end', 'url(#arrow5)');
  }

  // argument prongs into process node from below
  const proc = stages[1];
  args.forEach((a, i) => {
    const ax = proc.cx - boxW / 4 + i * (boxW / 2);
    const ay = cy + boxH / 2 + 56;
    gAxes.append('line').attr('x1', ax).attr('y1', ay).attr('x2', ax).attr('y2', cy + boxH / 2)
      .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1).attr('marker-end', 'url(#arrow5)');
    const g = gChart.append('g').attr('class', 'arg-g node-g').attr('tabindex', 0)
      .attr('role', 'img').attr('aria-label', `Argument ${a.label}: ${a.desc}`).datum(a);
    g.append('rect').attr('class', 'node-rect').attr('x', ax - 44).attr('y', ay).attr('width', 88).attr('height', 26)
      .attr('rx', 4).attr('fill', 'var(--color-fill)').attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1);
    g.append('text').attr('class', 'tick-label').attr('x', ax).attr('y', ay + 17).attr('text-anchor', 'middle').text(a.label);
  });

  // guard arc on process node
  gAxes.append('path').attr('d', `M${proc.cx + boxW / 2},${cy - boxH / 2 + 6} a 14 14 0 1 1 -6 -10`)
    .attr('fill', 'none').attr('stroke', 'var(--color-red)').attr('stroke-width', 1.5).attr('marker-end', 'url(#arrow5)');
  gChart.append('text').attr('class', 'tick-label').attr('x', proc.cx + boxW / 2 + 8).attr('y', cy - boxH / 2 - 6)
    .attr('fill', 'var(--color-red)').text('no overwrite').attr('aria-hidden', 'true');

  const fillFor = k => k === 'input' ? 'var(--color-fill)' : k === 'output' ? 'var(--color-red)' : 'var(--color-ink)';
  const txtFor = k => k === 'input' ? 'var(--color-ink)' : 'var(--color-white)';

  const g = gChart.selectAll('.stage-g').data(stages).join('g').attr('class', 'stage-g node-g')
    .attr('tabindex', 0).attr('role', 'img').attr('aria-label', d => `${d.label}: ${d.desc}`);
  g.append('rect').attr('class', 'node-rect').attr('x', d => d.cx - boxW / 2).attr('y', cy - boxH / 2)
    .attr('width', boxW).attr('height', boxH).attr('rx', 8)
    .attr('fill', d => fillFor(d.kind)).attr('stroke', 'var(--color-ink)').attr('stroke-width', 1);
  g.append('text').attr('class', 'node-label').attr('x', d => d.cx).attr('y', cy + 4)
    .attr('text-anchor', 'middle').attr('fill', d => txtFor(d.kind)).text(d => d.label);

  function show(event, d) { tooltip.html(`<strong>${d.label}</strong><br>${d.desc}`)
    .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
    .transition().duration(150).style('opacity', 1); }
  function move(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
  function hide() { tooltip.transition().duration(100).style('opacity', 0); }

  d3.selectAll('.node-g')
    .on('mouseover', function(event, d) { d3.selectAll('.node-rect').attr('opacity', 0.35); d3.select(this).selectAll('.node-rect').attr('opacity', 1); show(event, d); })
    .on('mousemove', move)
    .on('mouseout', function() { d3.selectAll('.node-rect').attr('opacity', 1); hide(); })
    .on('focus', function(event, d) { show(event, d); }).on('blur', hide);
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
